name: check

# The contract is the integration point between four people working in
# parallel. This fails the moment one side changes shape without the other.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - run: npm ci
        working-directory: contract

      - name: Contract tests
        run: npm test
        working-directory: contract

      - name: Validate the committed pipeline.json
        run: npm run validate
        working-directory: contract

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend
