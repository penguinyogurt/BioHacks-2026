name: check

# The contract is the integration point between four people working in
# parallel. This fails the moment one side changes shape without the other.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Typecheck and contract tests
        run: npm run check
        working-directory: app

      - name: Validate the committed pipeline.json
        run: npm run validate
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app
