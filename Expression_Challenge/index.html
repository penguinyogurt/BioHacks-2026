<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Expression challenge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2eb;color:#1a3232;font:16px/1.5 system-ui}main{width:min(760px,100%);margin:auto;padding:26px 18px}header,.bar,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #bbc6be;padding-bottom:12px}h1{font:clamp(1.8rem,5vw,2.8rem) Georgia;margin:0}h2{margin:20px 0 8px;font-size:clamp(1.25rem,4vw,1.8rem)}button,input{font:inherit}button{border:1px solid #356964;border-radius:7px;background:#fffef8;color:#174f4c;padding:8px 14px;cursor:pointer;font-weight:600}button.primary{background:#185a54;color:white}button:disabled{opacity:.5}.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:#182a2c;color:#dbe5dd;aspect-ratio:4/3;border-radius:14px}.stage>*{grid-area:1/1}.stage video,.stage canvas{width:100%;height:100%;object-fit:contain}.stage video{transform:scaleX(-1)}[hidden]{display:none!important}#timer{position:absolute;top:12px;right:16px;font-size:2.2rem;font-weight:700;border-radius:12px;background:#102123dc;color:white;padding:0 14px}.bar{margin:14px 0}input{width:5em;padding:4px}.result{border-left:5px solid #31766c;background:#fffef9;margin:12px 0;padding:12px 16px}.result strong{font-size:1.5rem}.actions{justify-content:flex-start}p{margin:6px 0}
</style><main><header><h1>Expression challenge</h1><div><button id="start">Start camera</button> <button id="stop" hidden>Stop</button></div></header>
<h2 id="prompt" aria-live="polite">Happy — give the camera a smile</h2><div class="stage"><span id="placeholder">Camera is off</span><video id="live" autoplay playsinline muted hidden></video><canvas id="photo" hidden></canvas><span id="timer" hidden></span></div>
<div class="bar"><label>Pass threshold <input id="threshold" type="number" min="0" max="100" step="1" value="80"> %</label><small>Photos stay on this device</small></div>
<section id="result" class="result" aria-live="polite" hidden><strong id="verdict"></strong><p id="detail"></p><h2 id="summary" hidden></h2></section><div class="actions"><button id="ready" class="primary" hidden>Ready</button><button id="again" class="primary" hidden>Try again</button><button id="next" hidden>Next expression</button></div>
<script src="/round.js"></script></main></html>
