<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Facial expressions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2eb;color:#1a3232;font:16px/1.5 system-ui}main{width:min(760px,100%);margin:auto;padding:26px 18px}header,.bar,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #bbc6be;padding-bottom:12px}h1{font:clamp(1.8rem,5vw,2.8rem) Georgia;margin:0}h2{margin:20px 0 8px;font-size:clamp(1.25rem,4vw,1.8rem)}button,input{font:inherit}button{border:1px solid #356964;border-radius:7px;background:#fffef8;color:#174f4c;padding:8px 14px;cursor:pointer;font-weight:600}button.primary{background:#185a54;color:white}button:disabled{opacity:.5}.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:#182a2c;color:#dbe5dd;aspect-ratio:4/3;border-radius:14px}.stage>*{grid-area:1/1}.stage video,.stage canvas{width:100%;height:100%;object-fit:contain}.stage video{transform:scaleX(-1)}[hidden]{display:none!important}#timer{position:absolute;top:12px;right:16px;font-size:2.2rem;font-weight:700;border-radius:12px;background:#102123dc;color:white;padding:0 14px}.bar{margin:14px 0}input{width:5em;padding:4px}.result{border-left:5px solid #31766c;background:#fffef9;margin:12px 0;padding:12px 16px}.result strong{font-size:1.5rem}.actions{justify-content:flex-start}p{margin:6px 0}
#reviewPage{min-height:85vh;align-content:center;text-align:center;width:min(980px,100%)}#photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px auto}#photos figure{margin:0}#photos img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#19302e;border-radius:10px}#photos figcaption{font-weight:650}#photos small{display:block}#photos [data-pass=true]{color:#176749}#photos [data-pass=false]{color:#983c31}@media(max-width:650px){#photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.actions{justify-content:center;margin:24px 0 12px}
#challenge.scored{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.scored #stop{display:none}.scored .stage{width:min(370px,80vw)}.scored .result{background:transparent;border:0;margin:6px 0}.scored .result p{font-size:1rem}
.scored .actions{margin-top:clamp(20px,7vh,70px)}#challenge header{width:100%;justify-content:center;margin-bottom:14px}
#prompt{width:100%;text-align:center;font:700 clamp(1.4rem,3vw,2rem)/1.25 system-ui,sans-serif}
#stop{position:absolute;top:12px;left:12px;z-index:1}

button[data-proceed]{position:relative;font-size:1.25rem;font-weight:650;border-radius:12px;min-height:58px;min-width:min(270px,88%);padding:12px 24px;background:#195e50;color:white}
button[data-proceed]:not(:disabled)::before,button[data-proceed]:not(:disabled)::after{content:"";position:absolute;inset:0;pointer-events:none;border:3px solid #699e8b;border-radius:inherit;animation:guidePulse 1s ease-out infinite}
button[data-proceed]:not(:disabled)::after{animation-delay:-.5s}
@keyframes guidePulse{from{inset:0;opacity:.52;border-color:#699e8b}55%{opacity:.30;border-color:#83b6a1}to{inset:-20px;opacity:0;border-color:#91d7b7}}
@media(prefers-reduced-motion:reduce){button[data-proceed]:not(:disabled)::before,button[data-proceed]:not(:disabled)::after{animation:none;opacity:0}}
.stage{width:min(100%,640px,calc(62dvh * 1.3333));margin-inline:auto}.scored .stage{width:min(370px,80vw,calc(46dvh * 1.3333))}</style><main id="challenge"><header><h1 id="prompt" aria-live="polite">Happy — give the camera a smile</h1></header><div class="stage"><button id="stop" hidden>Stop</button><span id="placeholder">Camera is off</span><video id="live" autoplay playsinline muted hidden></video><canvas id="photo" hidden></canvas><span id="timer" hidden></span></div>

<section id="result" class="result" aria-live="polite" hidden><strong id="verdict"></strong><p id="detail"></p></section><div class="actions"><button data-proceed id="start" class="primary">Start Camera</button><button data-proceed id="ready" class="primary" hidden>Ready</button><button data-proceed id="next" hidden>Next expression</button></div>
</main><main id="reviewPage" hidden><h1 tabindex="-1" id="reviewTitle">Facial results</h1><p id="totalRight"></p><div id="photos"></div></main><script src="round.js"></script></html>
